[package]
name = "liravm"
version = "0.1.0"
edition = "2021"
description = "Lira Virtual Machine - executes .lic bytecode files"
license = "MIT"

[[bin]]
name = "liravm"
path = "src/main.rs"

[lib]
name = "liravm"
path = "src/lib.rs"

[dependencies]
lira-core = { path = "../lira-core" }
base64 = "0.22"
chrono = "0.4"
dirs = "6"
hex = "0.4"
md-5 = "0.11"
regex = "1"
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
ureq = "3"
uuid = { version = "1", features = ["v4", "v7"] }
# `unstable-stats` exposes `gc::stats()` (live-heap accounting, used to assert
# cyclic reclamation in tests); `unstable-config` exposes `gc::configure()` (used
# to drive collection deterministically from the VM loop). Both only re-export
# functions already present in the crate.
gc = { version = "0.5", features = ["derive", "unstable-stats", "unstable-config"] }
