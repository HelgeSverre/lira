[package]
name = "liravm"
version = "0.1.0"
edition = "2021"
description = "Lira Virtual Machine - executes .lic bytecode files"
license = "MIT"

[[bin]]
name = "liravm"
path = "src/main.rs"

[lib]
name = "liravm"
path = "src/lib.rs"

[dependencies]
lira-core = { path = "../lira-core" }
base64 = "0.22"
chrono = "0.4"
dirs = "5"
hex = "0.4"
md-5 = "0.10"
regex = "1"
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
ureq = "2"
uuid = { version = "1", features = ["v4", "v7"] }
