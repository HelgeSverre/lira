[package]
name = "lirac"
version = "0.1.0"
edition = "2021"
description = "Lira compiler - compiles .li source files to .lic bytecode"
license = "MIT"

[[bin]]
name = "lirac"
path = "src/main.rs"

[lib]
name = "lirac"
path = "src/lib.rs"

[dependencies]
lira-core = { path = "../lira-core" }
liravm = { path = "../liravm" }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_json"]
