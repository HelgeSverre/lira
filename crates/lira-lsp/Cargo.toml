[package]
name = "lira-lsp"
version = "0.1.0"
edition = "2021"
description = "Language Server Protocol (LSP) implementation for Lira"
license = "MIT"

[[bin]]
name = "lira-lsp"
path = "src/main.rs"

[lib]
name = "lira_lsp"
path = "src/lib.rs"

[dependencies]
lirac = { path = "../lirac" }
lira-core = { path = "../lira-core" }
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "5.5"
ropey = "1.6"
regex = "1.10"
once_cell = "1.19"

[dev-dependencies]
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
bytes = "1.5"
