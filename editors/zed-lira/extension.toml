id = "lira"
name = "Lira"
version = "0.1.0"
schema_version = 1
description = "Lira programming language support with syntax highlighting and LSP."
repository = "https://github.com/HelgeSverre/lira"
authors = ["Lira contributors"]

[grammars.lira]
repository = "https://github.com/HelgeSverre/lira"
path = "editors/tree-sitter-lira"
rev = "main"

[language_servers.lira-lsp]
name = "Lira Language Server"
languages = ["Lira"]

[language_servers.lira-lsp.binary]
path = "lira-lsp"
arguments = []
